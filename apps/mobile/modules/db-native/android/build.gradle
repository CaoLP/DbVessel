apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.dbvessel.dbnative'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
  ext.getKotlinVersion = {
    ext.has("kotlinVersion") ? ext.kotlinVersion() : ext.safeExtGet("kotlinVersion", "1.8.10")
  }
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${getKotlinVersion()}")
  }
}

android {
  namespace "expo.modules.dbnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }

  sourceSets {
    main {
      // Bundles the cargo-ndk release output for shared-rust (built via:
      // cargo ndk -t arm64-v8a -t x86_64 -o android/src/main/jniLibs build --release
      // from packages/shared-rust)
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"
  implementation "net.java.dev.jna:jna:5.13.0@aar"
}
